<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Number</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="clear_input.js" defer></script>
</head>
<body>
    <Header class="text-center mt-5">
        <h1> Lucky Number </h1>
    </Header>
    <main class="d-flex align-items-center justify-content-center">
        <form action="number.php" method="get" id="luckyForm">
            <label for="idnumber1" class="form-label mt-4">From</label>
            <input type="number" min="0" step="0" name="number1" id="idnumber1" class="form-control mb-2" required >
            <label for="idnumber2" class="form-label">To</label>
            <input type="number" min="0" step="0" name="number2" id="idnumber2" class="form-control" required>
            <button type="submit" class="btn bg-primary mt-3 mb-4">Draw Number</button>
        </form>
    </main>
</body>
</html>
